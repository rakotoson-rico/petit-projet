<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiplication js</title>
</head>

<body>
    <input type="text" id="nom" placeholder="entrez votre nom ">
    <button id="nomb">valider</button>
    <script>
        const input = document.getElementById('nom')
        const button = document.getElementById('nomb')
        // clic sur le button
        button.addEventListener('click', function () {
            // maka ny donné 
            const valeurUtilisateur = input.value;
            document.write(`Bonjour ${valeurUtilisateur} comment ça va aujourd'hui`);
        }
        )
        for(i,i<11,i * valeurUtilisateur){
            document.write(i*valeurUtilisateur)
        }
    
        //let nom = prompt("Quel est votre nom ")
       // let prenom = prompt("Quel est votre prenom ?");
        if (nom, prenom) {

            document.write(`Bonjour ${nom} ${prenom}`);

        }
    </script>
</body>

</html>
